<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দোকানের ইনভেন্টরি ও বারকোড স্ক্যানার</title>
    <!-- বারকোড স্ক্যান করার লাইব্রেরি -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 15px; background-color: #f4f4f9; margin: 0; }
        
        .header-card {
            background: #ffffff;
            padding: 15px;
            margin: 10px auto 20px auto;
            max-width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            border-left: 5px solid #28a745;
        }
        .profile-img-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #28a745;
            flex-shrink: 0;
            background-color: #eee;
            cursor: pointer;
        }
        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header-info h3 { margin: 0 0 5px 0; color: #333; font-size: 18px; }
        .header-info p { margin: 0; color: #666; font-size: 13px; }
        
        #reader { width: 100%; max-width: 350px; margin: 0 auto; border-radius: 8px; overflow: hidden; }
        .product-card { background: white; padding: 15px; margin: 10px auto; max-width: 350px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; position: relative; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
        input, button { padding: 12px; margin: 6px 0; width: 100%; box-sizing: border-box; font-size: 16px; }
        button { background-color: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-delete { background-color: #dc3545; color: white; padding: 8px 12px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 8px; width: 100%; }
        .found-box { background: #e8f5e9; border: 2px solid #28a745; }
        .status-msg { font-size: 13px; color: #007bff; font-weight: bold; margin: 5px 0; }
    </style>
</head>
<body>

    <!-- দোকানের মালিকের প্রোফাইল ও হেডার -->
    <div class="header-card">
        <div class="profile-img-container" onclick="document.getElementById('owner-img-input').click();">
            <img id="owner-img" src="https://via.placeholder.com/100?text=Upload" alt="মালিকের ছবি">
        </div>
        <div class="header-info">
            <h3>দোকানের ইনভেন্টরি</h3>
            <p>ছবি পরিবর্তন করতে ট্যাপ করুন</p>
        </div>
        <input type="file" id="owner-img-input" accept="image/*" style="display:none;">
    </div>

    <!-- ক্যামেরা দেখানোর জায়গা -->
    <div id="reader"></div>

    <!-- সেভ থাকা প্রোডাক্ট খুঁজে পেলে দেখানোর ঘর -->
    <div id="scanned-result" style="display:none;" class="product-card found-box">
        <h3 style="color:#28a745; margin-top:0;">প্রোডাক্ট পাওয়া গেছে!</h3>
        <img id="res-img" src="" alt="প্রোডাক্ট ছবি">
        <h3 id="res-name" style="margin:5px 0;"></h3>
        <p>কোম্পানি/ব্র্যান্ড: <b id="res-brand"></b></p>
        <p>বারকোড: <b id="res-barcode"></b></p>
        <p>দাম: <b id="res-price" style="font-size: 18px; color: #d32f2f;"></b> AED</p>
        <button onclick="resetScanner()">আবার স্ক্যান করুন</button>
    </div>

    <!-- নতুন প্রোডাক্ট যুক্ত করার ফরম -->
    <div id="product-form" style="display:none;" class="product-card">
        <h3>নতুন প্রোডাক্ট যুক্ত করুন</h3>
        <p>বারকোড: <b id="scanned-code"></b></p>
        <div id="fetch-status" class="status-msg"></div>
        <input type="text" id="prod-name" placeholder="প্রোডাক্টের নাম">
        <input type="text" id="prod-brand" placeholder="কোম্পানি/ব্র্যান্ডের নাম">
        <input type="number" id="prod-price" placeholder="দাম (AED)">
        <label style="font-size:14px; color:#555;">সরাসরি প্রোডাক্টের ছবি তুলুন:</label>
        
        <!-- capture="environment" থাকার কারণে সরাসরি ব্যাক ক্যামেরা চালু হবে -->
        <input type="file" id="prod-img" accept="image/*" capture="environment">
        
        <button onclick="saveProduct()">সেভ করুন</button>
    </div>

    <h3>সেভ করা প্রোডাক্ট তালিকা</h3>
    <div id="product-list"></div>

    <script>
        let scannedBarcode = "";
        let products = JSON.parse(localStorage.getItem('my_products')) || [];
        let html5QrcodeScanner;
        let selectedImageData = "";

        // বিওপ (Beep) সাউন্ড তৈরির ফাংশন
        function playBeepSound() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio Error:", e);
            }
        }

        // প্রোফাইল ছবি লোড
        let savedOwnerImg = localStorage.getItem('owner_photo');
        if (savedOwnerImg) {
            document.getElementById('owner-img').src = savedOwnerImg;
        }

        // প্রোফাইল ছবি পরিবর্তন
        document.getElementById('owner-img-input').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('owner-img').src = evt.target.result;
                    localStorage.setItem('owner_photo', evt.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        renderProducts();
        startScanner();

        // প্রোডাক্টের ছবি তুলে প্রসেস করা
        document.getElementById('prod-img').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(evt) {
                    selectedImageData = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }

        // বারকোড স্ক্যান সফল হলে
        async function onScanSuccess(decodedText) {
            playBeepSound();
            scannedBarcode = decodedText;
            
            let existingProduct = products.find(p => p.barcode === scannedBarcode);

            if (existingProduct) {
                document.getElementById('res-name').innerText = existingProduct.name;
                document.getElementById('res-brand').innerText = existingProduct.brand || 'N/A';
                document.getElementById('res-barcode').innerText = existingProduct.barcode;
                document.getElementById('res-price').innerText = existingProduct.price;
                document.getElementById('res-img').src = existingProduct.image || 'https://via.placeholder.com/150?text=No+Image';
                
                document.getElementById('scanned-result').style.display = 'block';
                document.getElementById('product-form').style.display = 'none';
            } else {
                document.getElementById('scanned-code').innerText = scannedBarcode;
                document.getElementById('product-form').style.display = 'block';
                document.getElementById('scanned-result').style.display = 'none';

                // ফর্মে আগের ডেটা পরিষ্কার করা
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-brand').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('fetch-status').innerText = 'অনলাইনে প্রোডাক্টের তথ্য খোঁজা হচ্ছে...';

                // অনলাইনে প্রোডাক্টের তথ্য খোঁজা (Open Food Facts API)
                try {
                    let response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${scannedBarcode}.json`);
                    let data = await response.json();

                    if (data.status === 1 && data.product) {
                        let pName = data.product.product_name || data.product.product_name_en || '';
                        let pBrand = data.product.brands || '';

                        document.getElementById('prod-name').value = pName;
                        document.getElementById('prod-brand').value = pBrand;

                        if (pName) {
                            document.getElementById('fetch-status').innerText = '✓ অনলাইনে প্রোডাক্ট ও কোম্পানির তথ্য পাওয়া গেছে!';
                        } else {
                            document.getElementById('fetch-status').innerText = 'অনলাইনে নাম পাওয়া যায়নি, ম্যানুয়ালি লিখুন।';
                        }
                    } else {
                        document.getElementById('fetch-status').innerText = 'অনলাইনে পাওয়া যায়নি, ম্যানুয়ালি লিখে সেভ করুন।';
                    }
                } catch (err) {
                    document.getElementById('fetch-status').innerText = 'তথ্য খোঁজায় সমস্যা হয়েছে, ম্যানুয়ালি লিখুন।';
                }
            }
        }

        function resetScanner() {
            document.getElementById('scanned-result').style.display = 'none';
            document.getElementById('product-form').style.display = 'none';
        }

        // প্রোডাক্ট সেভ করা
        function saveProduct() {
            let name = document.getElementById('prod-name').value;
            let brand = document.getElementById('prod-brand').value;
            let price = document.getElementById('prod-price').value;

            if(!name || !price) {
                alert("নাম এবং দাম দুটোই লিখুন!");
                return;
            }

            let item = { 
                barcode: scannedBarcode, 
                name: name, 
                brand: brand,
                price: price, 
                image: selectedImageData 
            };
            
            products.push(item);
            localStorage.setItem('my_products', JSON.stringify(products));

            renderProducts();
            
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-brand').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-img').value = '';
            selectedImageData = "";
            document.getElementById('product-form').style.display = 'none';
            document.getElementById('fetch-status').innerText = '';
        }

        // প্রোডাক্ট ডিলিট করা
        function deleteProduct(index) {
            if (confirm("আপনি কি নিশ্চিত যে এই প্রোডাক্টটি মুছে ফেলতে চান?")) {
                products.splice(index, 1);
                localStorage.setItem('my_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function renderProducts() {
            let listDiv = document.getElementById('product-list');
            listDiv.innerHTML = '';
            products.forEach((p, index) => {
                let imgTag = p.image ? `<img src="${p.image}" alt="${p.name}">` : '';
                let brandInfo = p.brand ? `<br>কোম্পানি: ${p.brand}` : '';
                listDiv.innerHTML += `
                    <div class="product-card">
                        ${imgTag}
                        <b>${p.name}</b>${brandInfo}<br>
                        বারকোড: ${p.barcode}<br>
                        দাম: <b>${p.price} AED</b><br>
                        <button class="btn-delete" onclick="deleteProduct(${index})">ডিলিট করুন</button>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>

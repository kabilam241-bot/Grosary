<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grosary Inventory</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f6f8fc;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }

        .header {
            margin-bottom: 20px;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-pic-container {
            position: relative;
            cursor: pointer;
        }

        .profile-pic {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2563eb;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            color: #1e293b;
        }

        .back-btn {
            background-color: #e2e8f0;
            color: #334155;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: none;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            max-width: 450px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            transition: transform 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #ffffff;
        }

        .card:active {
            transform: scale(0.96);
        }

        .card img {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            object-fit: contain;
        }

        .card p {
            margin: 0;
            font-weight: 600;
            font-size: 15px;
            color: #334155;
        }

        .page-view {
            display: none;
            max-width: 450px;
            margin: 0 auto;
        }

        #reader, #form-reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .form-card, .result-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            margin-top: 15px;
        }

        input, button {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            outline: none;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-scan-inline {
            background-color: #059669;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .item-list-entry {
            display: flex;
            align-items: center;
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .item-list-entry img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 12px;
        }

        .item-details { flex-grow: 1; }
        .item-details h4 { margin: 0 0 4px 0; font-size: 15px; color: #1e293b; }
        .item-details p { margin: 2px 0; font-size: 12px; color: #64748b; }

        .btn-del {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-user">
            <div class="profile-pic-container" onclick="document.getElementById('user-pic-file').click();">
                <img id="user-profile-img" class="profile-pic" src="https://via.placeholder.com/150" alt="Profile">
                <input type="file" id="user-pic-file" accept="image/*" style="display:none;">
            </div>
            <h1 id="title">Home</h1>
        </div>
        <button id="back-btn" class="back-btn" onclick="showHome()">Back</button>
    </div>

    <!-- হোম ভিউ -->
    <div id="home-view" class="grid-container">
        <div class="card" onclick="openScanner()">
            <img src="https://cdn-icons-png.flaticon.com/512/3483/3483015.png" alt="Scan">
            <p>Scan</p>
        </div>

        <div class="card" onclick="openNewProduct('')">
            <img src="https://cdn-icons-png.flaticon.com/512/6831/6831000.png" alt="New product">
            <p>New product</p>
        </div>

        <div class="card" onclick="openProductsList()">
            <img src="https://cdn-icons-png.flaticon.com/512/679/679821.png" alt="Products">
            <p>Products</p>
        </div>

        <div class="card" onclick="alert('Feature coming soon!')">
            <img src="https://cdn-icons-png.flaticon.com/512/4285/4285667.png" alt="Statistics">
            <p>Statistics</p>
        </div>

        <div class="card" onclick="alert('Feature coming soon!')">
            <img src="https://cdn-icons-png.flaticon.com/512/3062/3062631.png" alt="Export / Import">
            <p>Export / Import</p>
        </div>

        <div class="card" onclick="alert('Feature coming soon!')">
            <img src="https://cdn-icons-png.flaticon.com/512/2099/2099058.png" alt="Settings">
            <p>Settings</p>
        </div>
    </div>

    <!-- স্ক্যানার ভিউ -->
    <div id="scan-view" class="page-view">
        <div id="reader"></div>
        <div id="scan-res" class="result-card" style="display:none;">
            <h3 style="margin-top:0; color:#16a34a;">Product Found!</h3>
            <img id="res-img" src="" alt="Product Image" style="width:100%; height:180px; object-fit:cover; border-radius:10px;">
            <h3 id="res-name" style="margin: 10px 0 5px 0;"></h3>
            <p style="margin:2px 0;">Brand: <span id="res-brand" style="font-weight:600;"></span></p>
            <p style="margin:2px 0;">Barcode: <span id="res-code" style="font-weight:600;"></span></p>
            
            <!-- প্রাইস সেকশন বড় এবং বোল্ড করা হলো -->
            <div style="margin: 10px 0; background: #f8fafc; padding: 10px; border-radius: 8px; text-align: center;">
                <span style="font-size: 14px; color: #64748b; display: block;">Price</span>
                <span id="res-price" style="font-weight: 800; color: #dc2626; font-size: 26px;"></span> 
                <span style="font-weight: 700; color: #dc2626; font-size: 18px;">AED</span>
            </div>

            <button onclick="rescan()">Scan Again</button>
        </div>
    </div>

    <!-- নতুন প্রোডাক্ট ফর্ম -->
    <div id="form-view" class="page-view">
        <div class="form-card">
            <button class="btn-scan-inline" onclick="startFormScanner()">📷 Scan Barcode to Fill</button>
            <div id="form-reader" style="display:none; margin-bottom:10px;"></div>

            <label style="font-size:13px; font-weight:600; color:#475569;">Barcode Number:</label>
            <input type="text" id="p-barcode" placeholder="Scan or enter Barcode">
            
            <div id="status-msg" style="font-size:13px; color:#2563eb; margin-bottom:5px;"></div>
            <img id="preview-image" src="" style="width:100%; height:150px; object-fit:cover; border-radius:8px; display:none; margin-bottom:10px;">

            <label style="font-size:13px; font-weight:600; color:#475569;">Product Details:</label>
            <input type="text" id="p-name" placeholder="Product Name">
            <input type="text" id="p-brand" placeholder="Brand Name">
            <input type="number" id="p-price" placeholder="Price (AED)">
            <input type="file" id="p-file" accept="image/*" capture="environment">

            <button onclick="saveProduct()">Save Product</button>
        </div>
    </div>

    <!-- প্রোডাক্ট তালিকা -->
    <div id="list-view" class="page-view">
        <div id="items-container"></div>
    </div>

    <script>
        let qrScanner = null;
        let formQrScanner = null;
        let imageBase64 = "";

        window.onload = function() {
            let savedPic = localStorage.getItem('user_profile_pic');
            if(savedPic) {
                document.getElementById('user-profile-img').src = savedPic;
            }
        };

        document.getElementById('user-pic-file').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = function(evt) {
                    let userImg = evt.target.result;
                    document.getElementById('user-profile-img').src = userImg;
                    localStorage.setItem('user_profile_pic', userImg);
                };
                reader.readAsDataURL(file);
            }
        });

        function playBeep() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function hideAll() {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('scan-view').style.display = 'none';
            document.getElementById('form-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('back-btn').style.display = 'inline-block';
            stopQr();
            stopFormQr();
        }

        function showHome() {
            hideAll();
            document.getElementById('home-view').style.display = 'grid';
            document.getElementById('back-btn').style.display = 'none';
            document.getElementById('title').innerText = 'Home';
        }

        function openScanner() {
            hideAll();
            document.getElementById('scan-view').style.display = 'block';
            document.getElementById('scan-res').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            document.getElementById('title').innerText = 'Scan Barcode';
            startQr();
        }

        function openNewProduct(code = "") {
            hideAll();
            document.getElementById('form-view').style.display = 'block';
            document.getElementById('title').innerText = 'New Product';
            resetForm();

            if(code) {
                document.getElementById('p-barcode').value = String(code).trim();
                fetchOnlineDetails(code);
            }
        }

        function openProductsList() {
            hideAll();
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('title').innerText = 'Products';
            renderProducts();
        }

        function startQr() {
            if(!qrScanner) {
                qrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                qrScanner.render(onScanSuccess);
            }
        }

        function stopQr() {
            if(qrScanner) {
                qrScanner.clear().catch(e => console.log(e));
                qrScanner = null;
            }
        }

        function startFormScanner() {
            document.getElementById('form-reader').style.display = 'block';
            if(!formQrScanner) {
                formQrScanner = new Html5QrcodeScanner("form-reader", { fps: 10, qrbox: 220 });
                formQrScanner.render(function(decodedText) {
                    playBeep();
                    document.getElementById('p-barcode').value = String(decodedText).trim();
                    fetchOnlineDetails(decodedText);
                    stopFormQr();
                });
            }
        }

        function stopFormQr() {
            if(formQrScanner) {
                formQrScanner.clear().catch(e => console.log(e));
                formQrScanner = null;
            }
            document.getElementById('form-reader').style.display = 'none';
        }

        function rescan() {
            document.getElementById('scan-res').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            startQr();
        }

        function onScanSuccess(decodedText) {
            playBeep();
            let scannedCode = String(decodedText).trim();
            stopQr();
            document.getElementById('reader').style.display = 'none';

            let products = JSON.parse(localStorage.getItem('my_grosary_items')) || [];
            let found = products.find(p => String(p.barcode).trim() === scannedCode);

            if(found) {
                document.getElementById('res-name').innerText = found.name;
                document.getElementById('res-brand').innerText = found.brand || 'N/A';
                document.getElementById('res-code').innerText = found.barcode;
                document.getElementById('res-price').innerText = found.price;
                document.getElementById('res-img').src = found.image || 'https://via.placeholder.com/150';
                document.getElementById('scan-res').style.display = 'block';
            } else {
                alert("This product is not saved yet. Please save it first.");
                openNewProduct(scannedCode);
            }
        }

        async function fetchOnlineDetails(barcode) {
            document.getElementById('status-msg').innerText = 'Fetching online details...';
            try {
                let res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                let data = await res.json();
                if(data.status === 1 && data.product) {
                    let p = data.product;
                    if(p.product_name) document.getElementById('p-name').value = p.product_name;
                    if(p.brands) document.getElementById('p-brand').value = p.brands;
                    if(p.image_front_url) {
                        imageBase64 = p.image_front_url;
                        let img = document.getElementById('preview-image');
                        img.src = imageBase64;
                        img.style.display = 'block';
                    }
                    document.getElementById('status-msg').innerText = '✓ Found online info';
                } else {
                    document.getElementById('status-msg').innerText = 'Not found online. Enter details manually.';
                }
            } catch(e) {
                document.getElementById('status-msg').innerText = 'Enter details manually.';
            }
        }

        document.getElementById('p-file').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = function(evt) {
                    let img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        let canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');
                        let maxWidth = 400;
                        let scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                        
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        imageBase64 = canvas.toDataURL('image/jpeg', 0.6);
                        
                        let preview = document.getElementById('preview-image');
                        preview.src = imageBase64;
                        preview.style.display = 'block';
                    }
                }
                reader.readAsDataURL(file);
            }
        });

        function resetForm() {
            document.getElementById('p-barcode').value = '';
            document.getElementById('p-name').value = '';
            document.getElementById('p-brand').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-file').value = '';
            document.getElementById('preview-image').style.display = 'none';
            document.getElementById('status-msg').innerText = '';
            imageBase64 = "";
        }

        function saveProduct() {
            let barcode = document.getElementById('p-barcode').value.trim();
            let name = document.getElementById('p-name').value.trim();
            let brand = document.getElementById('p-brand').value.trim();
            let price = document.getElementById('p-price').value.trim();

            if(!barcode) {
                alert("Please scan or enter a Barcode!");
                return;
            }

            if(!name || !price) {
                alert("Please fill Name and Price!");
                return;
            }

            let products = JSON.parse(localStorage.getItem('my_grosary_items')) || [];
            
            let item = {
                barcode: barcode,
                name: name,
                brand: brand,
                price: price,
                image: imageBase64
            };

            try {
                products.push(item);
                localStorage.setItem('my_grosary_items', JSON.stringify(products));
                alert("Saved Successfully!");
                showHome();
            } catch(e) {
                alert("Storage Full! Please delete some items from Products.");
            }
        }

        function deleteItem(index) {
            if(confirm("Delete this item?")) {
                let products = JSON.parse(localStorage.getItem('my_grosary_items')) || [];
                products.splice(index, 1);
                localStorage.setItem('my_grosary_items', JSON.stringify(products));
                renderProducts();
            }
        }

        function renderProducts() {
            let container = document.getElementById('items-container');
            container.innerHTML = '';
            let products = JSON.parse(localStorage.getItem('my_grosary_items')) || [];

            if(products.length === 0) {
                container.innerHTML = '<p style="color:#64748b; text-align:center;">No saved products found.</p>';
                return;
            }

            products.forEach((p, i) => {
                let img = p.image || 'https://via.placeholder.com/50';
                container.innerHTML += `
                    <div class="item-list-entry">
                        <img src="${img}" alt="${p.name}">
                        <div class="item-details">
                            <h4>${p.name}</h4>
                            <p>Brand: ${p.brand || 'N/A'}</p>
                            <p>Barcode: <b>${p.barcode}</b></p>
                            <p>Price: <b style="color:#2563eb;">${p.price} AED</b></p>
                        </div>
                        <button class="btn-del" onclick="deleteItem(${i})">Delete</button>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>

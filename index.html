<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Inventory & Management</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-dark: #1b5e20;
            --accent-color: #fbc02d;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --danger-color: #d32f2f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
        }

        /* Auth Screen */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .auth-card h2 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .auth-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .auth-card button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Header Layout */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
        }

        .profile-container {
            position: relative;
            cursor: pointer;
        }

        .profile-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
            background: #ccc;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-warning { background: var(--accent-color); color: #333; }

        /* Product List */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #eee;
        }

        .product-info {
            padding: 12px;
            flex-grow: 1;
        }

        .product-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .product-price {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 15px;
        }

        .product-actions {
            padding: 10px;
            background: #fafafa;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        /* Modal Settings & Edit */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Auth Lock Screen -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>গুদাম ইনভেন্টরি লগইন</h2>
            <p style="font-size:13px; color:#666; margin-bottom:10px;">অ্যাপ ব্যবহার করতে পাসওয়ার্ড দিন</p>
            <input type="password" id="login-pass" placeholder="পাসওয়ার্ড লিখুন">
            <button onclick="checkPassword()">লগইন করুন</button>
            <p id="auth-err" style="color:red; font-size:13px; margin-top:8px; display:none;">ভুল পাসওয়ার্ড!</p>
        </div>
    </div>

    <!-- Main App Header -->
    <header>
        <div class="header-title">Grosary Inventory</div>
        <div class="profile-container" onclick="openSettings()">
            <img id="app-profile-img" src="https://via.placeholder.com/150" class="profile-pic" alt="Profile">
        </div>
    </header>

    <div class="container">
        <!-- Add / Edit Product Card -->
        <div class="card">
            <h3 id="form-heading">নতুন প্রোডাক্ট যোগ করুন</h3>
            <input type="hidden" id="edit-doc-id">
            <div class="form-group">
                <label>প্রোডাক্টের নাম:</label>
                <input type="text" id="prod-name" placeholder="যেমন: সয়াবিন তেল ১ লিটার">
            </div>
            <div class="form-group">
                <label>মূল্য (টাকা):</label>
                <input type="number" id="prod-price" placeholder="যেমন: ১৮০">
            </div>
            <div class="form-group">
                <label>পরিমাণ/স্টক:</label>
                <input type="text" id="prod-stock" placeholder="যেমন: ৫০ বোতল">
            </div>
            <div class="form-group">
                <label>ছবি URL (ঐচ্ছিক):</label>
                <input type="text" id="prod-img-url" placeholder="https://example.com/image.jpg">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="saveProduct()" id="save-btn">সেভ করুন</button>
                <button class="btn btn-warning hidden" onclick="resetForm()" id="cancel-btn">বাতিল</button>
            </div>
        </div>

        <!-- Product Display List -->
        <div class="card">
            <h3>প্রোডাক্ট তালিকা</h3>
            <div class="product-grid" id="product-container">
                <!-- Products will be dynamically loaded here -->
            </div>
        </div>
    </div>

    <!-- Settings Modal (Password & Profile Pic) -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px; color:var(--primary-color)">সেটিংস প্যানেল</h3>
            
            <div class="form-group">
                <label>প্রোফাইল ছবি URL আপডেট করুন:</label>
                <input type="text" id="new-profile-url" placeholder="নতুন ছবির লিংক দিন">
            </div>

            <div class="form-group" style="margin-top:15px;">
                <label>নতুন পাসওয়ার্ড সেট করুন:</label>
                <input type="password" id="new-password" placeholder="নতুন পাসওয়ার্ড দিন">
            </div>

            <div style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn btn-warning" onclick="closeSettings()">বন্ধ করুন</button>
                <button class="btn btn-primary" onclick="updateSettings()">সেভ করুন</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSy...", // Your Config Keys
            authDomain: "grosary-app.firebaseapp.com",
            projectId: "grosary-app",
            storageBucket: "grosary-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123def456"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let currentPassword = "1234"; // Default Password

        // Sync System Settings (Password & Profile Picture)
        db.collection("settings").doc("app_config").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                if (data.password) currentPassword = data.password;
                if (data.profilePic) {
                    document.getElementById("app-profile-img").src = data.profilePic;
                }
            }
        });

        // Authentication Check
        function checkPassword() {
            const entered = document.getElementById("login-pass").value;
            if (entered === currentPassword) {
                document.getElementById("auth-overlay").classList.add("hidden");
            } else {
                document.getElementById("auth-err").style.display = "block";
            }
        }

        // Real-Time Product Listener
        db.collection("products").onSnapshot((snapshot) => {
            const container = document.getElementById("product-container");
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const p = doc.data();
                const id = doc.id;
                const img = p.img || "https://via.placeholder.com/150";
                
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${img}" class="product-img" alt="${p.name}">
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">৳ ${p.price}</div>
                            <div style="font-size:13px; color:#666;">স্টক: ${p.stock || 'N/A'}</div>
                        </div>
                        <div class="product-actions">
                            <button class="btn btn-warning" onclick="editProduct('${id}', '${p.name}', '${p.price}', '${p.stock || ''}', '${p.img || ''}')">এডিট</button>
                            <button class="btn btn-danger" onclick="deleteProduct('${id}')">মুছুন</button>
                        </div>
                    </div>
                `;
            });
        });

        // Save or Update Product
        function saveProduct() {
            const docId = document.getElementById("edit-doc-id").value;
            const name = document.getElementById("prod-name").value;
            const price = document.getElementById("prod-price").value;
            const stock = document.getElementById("prod-stock").value;
            const img = document.getElementById("prod-img-url").value;

            if (!name || !price) {
                alert("দয়া করে নাম ও দাম সঠিক প্রদান করুন!");
                return;
            }

            const payload = { name, price: Number(price), stock, img };

            if (docId) {
                db.collection("products").doc(docId).update(payload).then(() => resetForm());
            } else {
                db.collection("products").add(payload).then(() => resetForm());
            }
        }

        // Edit Mode Pre-fill
        function editProduct(id, name, price, stock, img) {
            document.getElementById("edit-doc-id").value = id;
            document.getElementById("prod-name").value = name;
            document.getElementById("prod-price").value = price;
            document.getElementById("prod-stock").value = stock;
            document.getElementById("prod-img-url").value = img;

            document.getElementById("form-heading").innerText = "প্রোডাক্ট এডিট করুন";
            document.getElementById("save-btn").innerText = "আপডেট করুন";
            document.getElementById("cancel-btn").classList.remove("hidden");
        }

        // Delete Product
        function deleteProduct(id) {
            if (confirm("আপনি কি নিশ্চিত এই প্রোডাক্টটি মুছে ফেলতে চান?")) {
                db.collection("products").doc(id).delete();
            }
        }

        function resetForm() {
            document.getElementById("edit-doc-id").value = "";
            document.getElementById("prod-name").value = "";
            document.getElementById("prod-price").value = "";
            document.getElementById("prod-stock").value = "";
            document.getElementById("prod-img-url").value = "";

            document.getElementById("form-heading").innerText = "নতুন প্রোডাক্ট যোগ করুন";
            document.getElementById("save-btn").innerText = "সেভ করুন";
            document.getElementById("cancel-btn").classList.add("hidden");
        }

        // Settings Modal Actions
        function openSettings() {
            document.getElementById("settings-modal").style.display = "flex";
        }

        function closeSettings() {
            document.getElementById("settings-modal").style.display = "none";
        }

        function updateSettings() {
            const newPic = document.getElementById("new-profile-url").value;
            const newPass = document.getElementById("new-password").value;

            const updateData = {};
            if (newPic) updateData.profilePic = newPic;
            if (newPass) updateData.password = newPass;

            if (Object.keys(updateData).length > 0) {
                db.collection("settings").doc("app_config").set(updateData, { merge: true })
                .then(() => {
                    alert("সেটিংস সফলভাবে আপডেট হয়েছে!");
                    closeSettings();
                });
            } else {
                closeSettings();
            }
        }
    </script>
</body>
</html>
